name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check regexes with ICU (Android's regex engine)
        run: |
          sudo apt-get install -y -qq libicu-dev >/dev/null
          gcc tools/icu_regex_check.c -o icu_regex_check $(pkg-config --cflags --libs icu-i18n icu-uc)
          python3 tools/check_regex.py app/src/main/java | ./icu_regex_check

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TVDoctor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVDoctor-apk
          path: TVDoctor.apk

      # Every push to main refreshes the "latest" release, so the APK can be downloaded straight to a phone.
      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TVDoctor.apk --title "TV Doctor (сборка ${{ github.run_number }})" \
            --notes "Автоматическая сборка из ${{ github.sha }}. Скачайте TVDoctor.apk на телефон и установите." --latest
